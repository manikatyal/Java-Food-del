spring.application.name=food-delivery-backend

# Render sets PORT. Locally it falls back to 4000.
server.port=${PORT:4000}

# Database name comes from the URI path, e.g. mongodb+srv://user:pass@cluster0.xxx.mongodb.net/food-del
spring.data.mongodb.uri=${MONGO_URI}

# Secrets are read from the environment only. Never commit them.
app.jwt-secret=${JWT_SECRET}
app.stripe-secret-key=${STRIPE_SECRET_KEY:}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.upload-dir=${UPLOAD_DIR:uploads}

# Admin panel uploads food photos as multipart. Default Spring limit is 1MB.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Dates in JSON look like 2024-08-02T10:23:10.939Z (UTC).
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSX
spring.jackson.time-zone=UTC

# Load the starter menu into an empty database on first start.
app.seed-menu=${SEED_MENU:true}
